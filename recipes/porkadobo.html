<h2>Description</h2><p>Pork Adobo is a dish wherein pork is simmered in soy sauce and vinegar. This is considered as a favorite in Filipino households.
<h2>Ingredients</h2><ul><li>pork belly
<li>garlic
<li>dried bay leaves
<li>white vinegar
<li>soy sauce
<li>whole peppercorns
<li>water
<li>salt
